# READ ONLY DIRECTORY FOR AI COACH DATASET. Contains all files. 
# see ../dataset.md for more details on the dataset, how it's organized, and how to access it.
[dataset]
type = drive
scope = drive.readonly
service_account_file = <service-account-json-path>
root_folder_id = $RCLONE_FOLDERID_DATASET_READONLY

# READ/WRITE DIRECTORY FOR AGENT OUTPUT (for persistent research artifacts)
[agentoutput]
type = drive
scope = drive
service_account_file = <service-account-json-path>
root_folder_id = $RCLONE_FOLDERID_AGENTOUTPUT

# READ/WRITE DIRECTORY FOR PROCESSED MEDIA BUNDLE (consumed by the frontend, produced by motion-pipeline output)
[processedmediabundle]
type = drive
scope = drive
service_account_file = <service-account-json-path>
root_folder_id = $RCLONE_FOLDERID_PROCESSEDMEDIABUNDLE
