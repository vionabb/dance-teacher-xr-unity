name: Copilot Setup Steps

on:
  # Check that this workflow works when changes
  # are made to relevant files.
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/setup-rclone.sh
      - .github/rclone-template.conf
      - motion-pipeline/uv.lock
      - motion-pipeline/pyproject.toml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/setup-rclone.sh
      - .github/rclone-template.conf
      - motion-pipeline/uv.lock
      - motion-pipeline/pyproject.toml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install rclone
        run: |
          sudo -v
          curl https://rclone.org/install.sh | sudo bash
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: motion-pipeline/uv.lock
      - name: Set up Python
        run: uv python install 3.10
      - name: Install system media dependency
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install locked motion-pipeline environment
        working-directory: motion-pipeline
        run: uv sync --locked --group dev
      - name: Prepare MediaPipe model assets
        working-directory: motion-pipeline
        run: uv run --locked python -m motion_extraction.prepare_mediapipe_models --download
      - name: Configure and verify rclone
        run: bash .github/setup-rclone.sh
