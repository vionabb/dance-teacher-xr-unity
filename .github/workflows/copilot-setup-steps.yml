name: Copilot Setup Steps

on:
  # Check that this workflow works when changes
  # are made to relevant files.
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/setup-rclone.sh
      - .github/rclone-template.conf
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/setup-rclone.sh
      - .github/rclone-template.conf

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install rclone
        run: |
          sudo -v
          curl https://rclone.org/install.sh | sudo bash
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        run: |
          sudo curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Configure and verify rclone
        run: bash .github/setup-rclone.sh
