name: Frontend Motion Metrics Smoke Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "svelte-web-frontend/**"
      - "data/test-fixtures/smoketest/**"
      - ".github/workflows/frontend-motionmetrics-smoke.yml"
  pull_request:
    paths:
      - "svelte-web-frontend/**"
      - "data/test-fixtures/smoketest/**"
      - ".github/workflows/frontend-motionmetrics-smoke.yml"

jobs:
  frontend-motionmetrics-smoke:
    name: frontend-motionmetrics-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.12.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: svelte-web-frontend/pnpm-lock.yaml

      - name: Install locked frontend environment
        working-directory: svelte-web-frontend
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: svelte-web-frontend
        run: pnpm exec eslint . --max-warnings=0

      - name: Run single-input motion metrics smoke suite
        working-directory: svelte-web-frontend
        run: pnpm test -- --run src/lib/ai/motionmetrics/frontendMotionQuantifierSmoke.spec.ts
