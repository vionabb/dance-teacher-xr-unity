name: Frontend Motion Metrics Smoke Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "svelte-web-frontend/**"
      - "data/test-fixtures/smoketest/**"
      - ".github/workflows/frontend-motionmetrics-smoke.yml"
  pull_request:
    paths:
      - "svelte-web-frontend/**"
      - "data/test-fixtures/smoketest/**"
      - ".github/workflows/frontend-motionmetrics-smoke.yml"

jobs:
  frontend-motionmetrics-smoke:
    name: frontend-motionmetrics-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.12.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: svelte-web-frontend/pnpm-lock.yaml

      - name: Install locked frontend environment
        working-directory: svelte-web-frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        working-directory: svelte-web-frontend
        run: pnpm lint

      - name: Run single-input motion metrics smoke suite
        working-directory: svelte-web-frontend
        run: pnpm test -- --run src/lib/ai/motionmetrics/frontendMotionQuantifierSmoke.spec.ts

      - name: Verify hosted research contracts and isolated authorization schema
        working-directory: svelte-web-frontend
        run: |
          pnpm test -- --run src/lib/server/hosted-analysis.test.ts src/lib/server/chi25-analysis-contract.test.ts 'src/routes/api/research/discrepancy/[segmentId]/discrepancy.server.test.ts' src/lib/research/discrepancy.test.ts src/lib/research/discrepancy-client.test.ts src/lib/research/review-playback.test.ts src/lib/research/video-recovery.test.ts src/lib/server/research-store.test.ts
          pnpm test:research-schema

      - name: Verify login handoff and safe return destinations
        working-directory: svelte-web-frontend
        run: pnpm test -- --run src/routes/login/login.server.test.ts src/routes/auth/landing/landing.test.ts
