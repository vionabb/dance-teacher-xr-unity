[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dance-teacher-motion-pipeline"
version = "0.1.0"
description = "Offline pose, audio, complexity, and lesson-bundle processing for Dance Teacher XR."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
	"dance-teacher-pose-processing",
	"dataclasses-json==0.6.7",
    "librosa==0.11.0",
    "matplotlib==3.8.0",
    # MediaPipe 1.0.0's Holistic task graph aborts on macOS when its Metal
    # service is unavailable, even when CPU inference is requested. The 0.10.x
    # Tasks runtime is compatible with the current Holistic pipeline.
    "mediapipe==0.10.21",
    "numpy==1.25.2",
    "opencv-contrib-python==4.8.1.78",
    "pandas==2.3.3",
    "protobuf>=4.25.3,<5",
    "psutil==7.2.2",
    "pydub==0.25.1",
    "tqdm==4.67.1",
]

[dependency-groups]
dev = [
    "debugpy==1.8.0",
    "pytest>=8,<9",
]
# Historical BVH, Mecanim, and NAO work is intentionally not installed by
# default.  It remains runnable by opting into this group.
legacy-robotics = [
    "pytransform3d==3.16.0",
]
# Real-browser tests for the annotation tool (motion_extraction/tests/
# test_annotation_tool_browser.py) drive an actual Chromium instance, which
# is heavier and network-dependent (CDN-hosted Tailwind/daisyUI) compared to
# the rest of the suite. Kept out of the default dev group so a plain `uv
# sync` never requires a browser install; opt in with `uv sync --group
# browser-tests` and then `uv run playwright install chromium` once.
browser-tests = [
    "pytest-playwright>=0.5,<0.6",
]

[tool.setuptools.packages.find]
include = ["motion_extraction*"]

[tool.uv.sources]
dance-teacher-pose-processing = { path = "../pose-processing", editable = true }

[tool.pytest.ini_options]
testpaths = [
    "../pose-processing/tests",
    "motion_extraction/complexity_analysis/tests",
    "motion_extraction/tests",
]
markers = [
    "smoke: stage-contract and end-to-end motion-pipeline smoke tests",
    "browser: real-Chromium annotation-tool interaction tests (opt in, see browser-tests dependency group)",
]
filterwarnings = [
    # matplotlib uses deprecated pyparsing camelCase API (third-party, not fixable by us)
    "ignore::pyparsing.exceptions.PyparsingDeprecationWarning",
    # pydub contains invalid regex escape sequences (third-party, not fixable by us)
    "ignore:invalid escape sequence:DeprecationWarning:pydub",
]
